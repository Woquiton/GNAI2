services:
  app:
    image: gnai-php:dev
    build:
      context: .
      args:
        - USER_ID=${UID:-1000}
        - GROUP_ID=${GID:-1000}
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    container_name: gnai_app
    restart: unless-stopped
    env_file:
      - .env.dev
    volumes:
      - .:/var/www
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
      - ./docker/php/opcache.dev.ini:/usr/local/etc/php/conf.d/opcache.ini
      - ./docker/php/timezone.ini:/usr/local/etc/php/conf.d/timezone.ini
      - ./docker/php/www.conf:/usr/local/etc/php-fpm.d/www.conf
    command: sh /var/www/docker/php/entrypoint.sh app
    ports:
      - "9000:9000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$fp = @fsockopen(\"127.0.0.1\", 9000); if ($$fp) { fclose($$fp); exit(0); } exit(1);'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    environment:
      - TZ=America/Sao_Paulo
      - DB_CONNECTION=${DB_CONNECTION}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
    deploy:
      resources:
        limits:
          memory: 512M

  scheduler:
    image: gnai-php:dev
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    container_name: gnai_scheduler
    restart: unless-stopped
    env_file:
      - .env.dev
    volumes:
      - .:/var/www
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - TZ=America/Sao_Paulo
      - REDIS_HOST=redis
    command: sh /var/www/docker/php/entrypoint.sh scheduler
    deploy:
      resources:
        limits:
          memory: 128M

  db:
    image: mysql:8.0
    container_name: gnai_db
    restart: unless-stopped
    env_file:
      - .env.dev
    environment:
      - MYSQL_DATABASE=${DB_DATABASE}
      - MYSQL_USER=${DB_USERNAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/mysql/my.dev.cnf:/etc/mysql/conf.d/my.cnf
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "3307:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384M

  redis:
    image: redis:7-alpine
    container_name: gnai_redis
    restart: unless-stopped
    command: [ "redis-server", "/usr/local/etc/redis/redis.conf" ]
    volumes:
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    expose:
      - "6379"
    deploy:
      resources:
        limits:
          memory: 128M

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: pma_laravel
    restart: "no"
    profiles:
      - tools
    depends_on:
      - db
    environment:
      - TZ=America/Sao_Paulo
      - PMA_HOST=db
      - PMA_PORT=3306
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
    ports:
      - "8081:80"

  nginx:
    image: nginx:alpine
    container_name: gnai_nginx
    restart: unless-stopped
    volumes:
      - .:/var/www
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    depends_on:
      app:
        condition: service_healthy
    environment:
      - TZ=America/Sao_Paulo
      - NGINX_ENTRYPOINT_QUIET_LOGS=1
    deploy:
      resources:
        limits:
          memory: 64M

  node:
    image: node:20-alpine
    container_name: gnai_node
    working_dir: /var/www
    volumes:
      - .:/var/www
      - node_modules:/var/www/node_modules
    ports:
      - "5173:5173"
    restart: unless-stopped
    stdin_open: true
    tty: true
    env_file:
      - .env.dev
    environment:
      - TZ=America/Sao_Paulo
      - NPM_CONFIG_FUND=false
      - NPM_CONFIG_AUDIT=false
      - NPM_CONFIG_LOGLEVEL=error
    command: sh -c "if [ ! -d node_modules/vite ]; then npm install --no-package-lock --no-audit --no-fund --loglevel=error; fi && npm run dev -- --host 0.0.0.0"
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  dbdata:
  node_modules:
