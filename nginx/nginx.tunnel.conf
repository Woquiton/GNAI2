# Config para deploy atrás de Cloudflare Tunnel (cloudflared).
# O TLS/HTTPS é terminado na borda da Cloudflare; aqui dentro é só HTTP puro,
# então NÃO há bloco de redirect para https (geraria loop) nem certificado local.

server {
    listen 80;
    server_name gnai.guanambi.com.br;

    index index.php index.html;
    root /var/www/public;
    client_max_body_size 64M;

    # ==============================
    # Segurança
    # ==============================
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    server_tokens off;

    # ==============================
    # Gzip
    # ==============================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # ==============================
    # Cache de assets estáticos
    # ==============================
    location ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|webp|avif|woff2|woff|ttf)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, no-transform";
    }

    location /build/ {
        expires max;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # ==============================
    # Rotas Laravel
    # ==============================
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;

        # Resolver DNS embutido do Docker + fastcgi_pass via variável: força
        # o nginx a reconsultar o IP do container "app" a cada requisição,
        # em vez de resolver uma única vez na inicialização. Sem isso, toda
        # vez que o container "app" é recriado (deploy/rebuild) o nginx
        # continua apontando para o IP antigo e passa a responder 502 até
        # ser reiniciado manualmente.
        resolver 127.0.0.11 valid=10s;
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;

        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;

        # O Cloudflare Tunnel termina o HTTPS na borda e encaminha em HTTP puro
        # pra cá. Sem repassar esses headers, o Laravel acha que é HTTP e
        # quebra o cookie de sessão seguro (SESSION_SECURE_COOKIE=true).
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
    }

    location ~ /\.ht {
        deny all;
    }

    location ~ /\.env {
        deny all;
    }

    location ~ /\.git {
        deny all;
    }

    location ~* \.(sql|log|sh|bak)$ {
        deny all;
    }
}
