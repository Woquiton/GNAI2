file_uploads = On
memory_limit = 128M
upload_max_filesize = 100M
post_max_size = 100M
max_execution_time = 300
; O construtor do site envia mais de 1.000 campos; acima do limite o PHP descarta o
; restante (inclusive o _method) e o salvamento falha. 5.000 mantém a proteção contra
; envios com milhares de campos.
max_input_vars = 5000
